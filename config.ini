# Некритичные константы. Секреты хранятся в .env.

[ai]
# Модель JEV (разбор свободного текста в факты)
jev_model = ~typesafe/jev-latest
# Модель для объяснения результата
llm_model = openai/gpt-4.1-mini
base_url = https://openrouter.ai/api/v1
timeout_s = 20
retries = 2
explain_max_tokens = 900
jev_recognize_threshold = 0.3
jev_negation_threshold = 0.75
app_title = BGINFO bot
http_referer = https://bginfo.eu

[limits]
user_text_per_day = 30
user_explain_per_day = 10
# Суточный бюджет AI, USD (UTC-сутки)
daily_budget_usd = 2.0
# Консервативная оценка стоимости одного AI-вызова, USD: резервируется до вызова и
# подставляется, если провайдер не вернул стоимость
unknown_cost_usd = 0.01

[privacy]
retention_days = 90
backup_retention_days = 14

[bot]
# Контакт для консультации (показывается пользователю)
consult_contact =
timezone = Europe/Sofia
# Ссылка на бота (кнопка «Открыть бота» в админке)
bot_link = https://t.me/bginfosu_bot

[admin]
# 0.0.0.0 — админка открыта по IP сервера (http://IP:port); 127.0.0.1 — только через SSH-туннель
host = 0.0.0.0
# на сервере 8080 и 8081 заняты другими сервисами
port = 8091
login_max_attempts = 5
login_window_min = 15
session_ttl_hours = 12
# true — брать IP клиента из X-Forwarded-For (только за своим reverse proxy, иначе IP подделывается)
trust_proxy = false
