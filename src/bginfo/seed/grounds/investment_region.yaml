# Статус draft, все требования verified=false: одобрение и публикацию выполняет владелец в админке.
id: investment_region
title: "ВНЖ через инвестицию в компанию в экономически необлагодетелстван регион"
regime: third_country
subject: applicant
status: draft
version: 1
research_note: >-
  Исследование 2026-10-09 (docs/research/KB_RESEARCH.md, раздел 2.9). Основание — чл. 24 ал. 1 т. 20 ЗЧРБ; ППЗЧРБ чл. 29б.
  Не подтверждено: определение экономически необлагодетелстван регионов и их перечень задаёт правилник по ЗНИ (чл. 12 ЗНИ), правилник ЗНИ не читался.
  Отдельная статья BGINFO об инвестиционном ВНЖ не найдена при проверке: ссылка на общий обзор оснований.
applies_if:
  op: and
  all:
    - {op: in, fact: self.citizenship_group, values: [third]}
    - {op: not, cond: {op: in, fact: self.citizenship_group, values: [bg, eu]}}
unsupported:
  - cond:
      op: and
      all:
        - {op: eq, fact: case.who_moves, value: already_in_bg}
        - {op: in, fact: self.status_in_bg, values: [visa_d, long_term, permanent, protection]}
    reason: "Продление или смена уже имеющегося статуса бот пока не проверяет — нужен индивидуальный разбор."
summary: >-
  Основание для тех, кто вкладывает в капитал болгарской компании в экономически необлагодетелстван регионе сумму
  не меньше порога, владеет не менее половины капитала и создаёт рабочие места для граждан Болгарии.
requirements:
  - id: plan
    label: "Планируется крупная инвестиция в Болгарии"
    cond: {op: in, fact: self.ties, values: [investment]}
    kind: legal
    stage: any
    on_fail: not_eligible
    fail_text: "Основание доступно только тем, кто вкладывает в компанию в Болгарии."
    source_ids: [zchrb]
    verified: false
    research_status: consolidated
    research_note: "чл. 24 ал. 1 т. 20 ЗЧРБ: вложение в капитал болгарской компании «на не по-малко от 250 000 лв.»."
  - id: kind
    label: "Инвестиция — вложение в болгарскую компанию в отстающем регионе"
    cond: {op: eq, fact: self.invest_kind, value: company_region}
    kind: legal
    stage: any
    on_fail: not_eligible
    fail_text: "Для этого основания нужно вложение в компанию в отстающем регионе. Покупка недвижимости проверяется по другому основанию."
    unknown_text: "Уточните вид инвестиции."
    source_ids: [zchrb]
    verified: false
    research_status: consolidated
    research_note: "чл. 24 ал. 1 т. 20 ЗЧРБ; ППЗЧРБ чл. 29б."
  - id: amount
    label: "Сумма вложения в капитал не меньше {param:invest_region} (плюс новые долгосрочные активы на такую же сумму)"
    cond: {op: cmp, fact: self.invest_amount_eur, cmp: ">=", param: invest_region}
    kind: legal
    stage: permit
    on_fail: not_eligible
    fail_text: "Сумма ниже порога, установленного законом."
    unknown_text: "Уточните сумму инвестиции."
    source_ids: [zchrb, ppzchrb]
    verified: false
    research_status: consolidated
    research_note: "чл. 24 ал. 1 т. 20 ЗЧРБ: «на не по-малко от 250 000 лв.» и «нови дълготрайни материални и нематериални активи на стойност не по-малко от 250 000 лв.»; евро-сумма 127 822,97 в бланке ППЗЧРБ (ДВ бр. 7/2026, читано в консолидации)."
  - id: share
    label: "Доля иностранца в капитале компании не меньше 50%"
    cond: {op: known_true, fact: self.region_share_50}
    kind: legal
    stage: permit
    on_fail: not_eligible
    fail_text: "Доля иностранца в капитале должна быть не меньше половины."
    unknown_text: "Уточните размер доли в компании."
    source_ids: [zchrb]
    verified: false
    research_status: consolidated
    research_note: "чл. 24 ал. 1 т. 20 ЗЧРБ: «не по-малко от 50 на сто от капитала на дружеството»; иностранец — участник или акционер с именными акциями."
  - id: jobs
    label: "Создано не меньше {param:region_jobs_count} рабочих мест для граждан Болгарии"
    cond: {op: known_true, fact: self.region_jobs_ready}
    kind: legal
    stage: permit
    on_fail: not_eligible
    fail_text: "Без нужного числа рабочих мест для граждан Болгарии основание недоступно."
    unknown_text: "Уточните, готовы ли вы создать нужное число рабочих мест."
    source_ids: [zchrb]
    verified: false
    research_status: consolidated
    research_note: "чл. 24 ал. 1 т. 20 ЗЧРБ: «най-малко 5 работни места за български граждани» на срок пребывания; нужно подтверждение министерства."
restrictions:
  - text: "Перечень экономически необлагодетелстван регионов определяется правилником по закону о насърчаване на инвестициите; бот его не проверяет, регион и компанию нужно проверить отдельно."
    kind: legal
    scope: "не подтверждено: правилник ЗНИ не читался"
  - text: "Иностранец должен быть участником или акционером с именными акциями; кроме вложения в капитал нужны новые долгосрочные активы на такую же сумму."
    kind: legal
  - text: "Рабочие места нужно поддерживать на срок пребывания, их создание подтверждает министерство."
    kind: legal
  - text: "Сначала нужна виза D (консульство Болгарии), затем ВНЖ подаётся в Болгарии по тому же основанию."
    kind: legal
practice_notes:
  - text: "Отдельной статьи BGINFO об этом основании нет: BGINFO в обзоре оснований называет только суммы."
    scope: "по данным BGINFO"
    kind: practice
documents:
  - "Загранпаспорт"
  - "Документы о вложении в капитал и о новых долгосрочных активах компании"
  - "Документы о доле иностранца в капитале компании"
  - "Подтверждение министерства о рабочих местах"
  - "Медицинская страховка"
  - "Справка о несудимости (при первичной подаче)"
steps:
  - "Проверить, что регион и компания подпадают под закон о насърчаване на инвестициите."
  - "Вложить сумму в капитал компании и приобрести новые долгосрочные активы."
  - "Подать на визу D в консульстве Болгарии."
  - "После въезда подать заявление на ВНЖ в дирекцию «Миграция» (документы по чл. 29б правилника)."
family_note: "Члены семьи не получают ВНЖ автоматически — для них отдельная процедура как для членов семьи иностранца с видом на жительство."
goals: [work, long_term]
bginfo_source_ids: [bg_overview]
