# Статус draft, все требования verified=false: одобрение и публикацию выполняет владелец в админке.
id: bulgarian_origin
title: "Постоянное пребывание для иностранцев болгарского происхождения"
regime: bg_origin
subject: applicant
status: draft
version: 1
research_note: >-
  Исследование 2026-10-09 (docs/research/KB_RESEARCH.md, раздел 2.11). Основание — чл. 25 ал. 1 т. 1 ЗЧРБ. Текст читался в консолидации Ciela.
  Отдельная статья BGINFO о ВНЖ по происхождению не найдена при проверке: ссылка на общий раздел о ВНЖ.
  Не подтверждено: какой документ признаётся доказательством болгарского происхождения (закон о болгарах за границей и порядок выдачи документа не открывались).
applies_if: {op: not, cond: {op: in, fact: self.citizenship_group, values: [bg]}}
summary: >-
  Иностранцы болгарского происхождения могут получить сразу постоянное пребывание (ПМЖ), без предварительного ВНЖ.
  Нужен документ, подтверждающий болгарское происхождение.
requirements:
  - id: origin
    label: "Есть болгарское происхождение (болгарские корни)"
    cond: {op: in, fact: self.ties, values: [bg_origin]}
    kind: legal
    stage: any
    on_fail: not_eligible
    fail_text: "Основание доступно только иностранцам болгарского происхождения."
    source_ids: [zchrb]
    verified: false
    research_status: consolidated
    research_note: "чл. 25 ал. 1 т. 1 ЗЧРБ: постоянное пребывание могут получить иностранцы «от български произход»."
  - id: doc
    label: "Есть документ, подтверждающий болгарское происхождение"
    cond: {op: known_true, fact: self.bg_origin_doc}
    kind: procedure
    stage: permit
    on_fail: possible_after
    fail_text: "Нужно получить документ, подтверждающий болгарское происхождение."
    unknown_text: "Уточните, есть ли документ о болгарском происхождении."
    source_ids: [zchrb]
    verified: false
    research_status: unconfirmed
    research_note: "Какой именно документ признаётся доказательством происхождения, в отчёте не установлено (закон о болгарах за границей не открывался)."
restrictions:
  - text: "Заявление на постоянное пребывание подаётся лично в «Миграцию»; решение принимается в срок до двух месяцев, при сложностях — ещё до двух месяцев."
    kind: legal
  - text: "Студенты болгарского происхождения на очной форме обучения могут получить ВНЖ без визы D при наличии документа о происхождении."
    kind: legal
practice_notes:
  - text: "Условия получения гражданства по происхождению в базе не разбирались."
    scope: "не проверено"
    kind: practice
documents:
  - "Загранпаспорт"
  - "Документ, подтверждающий болгарское происхождение"
  - "Документ о жилье (аренда или собственность)"
  - "Медицинская страховка"
  - "Справка о несудимости"
steps:
  - "Получить документ, подтверждающий болгарское происхождение."
  - "Подать заявление на постоянное пребывание лично в дирекцию «Миграция»."
  - "Дождаться решения (до двух месяцев, при сложностях — до четырёх)."
family_note: "Для членов семьи отдельные нормы в этом основании не проверялись; применяются общие правила для членов семьи."
goals: [long_term, live]
bginfo_source_ids: [bg_rp_hub]
