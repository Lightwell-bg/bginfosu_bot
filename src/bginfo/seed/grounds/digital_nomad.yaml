# Статус draft, все требования verified=false: одобрение и публикацию выполняет владелец в админке.
id: digital_nomad
title: "ВНЖ для цифровых кочевников (Digital nomad)"
regime: third_country
subject: applicant
status: draft
version: 1
research_note: >-
  Исследование 2026-10-09 (docs/research/KB_RESEARCH.md, раздел 2.6). Основание — чл. 24 ал. 1 т. 23, чл. 24с и § 1 т. 36
  ДР ЗЧРБ (добавлены ДВ бр. 52/2025); документы — чл. 32г ППЗЧРБ (в силе от 20.12.2025). Текст читался в консолидации Ciela.
  Сумма порога дохода в евро не подтверждена: закон не говорит, МРЗ какого года брать.
applies_if:
  op: and
  all:
    - {op: in, fact: self.citizenship_group, values: [third]}
    - {op: not, cond: {op: in, fact: self.citizenship_group, values: [bg, eu]}}
unsupported:
  - cond:
      op: and
      all:
        - {op: eq, fact: case.who_moves, value: already_in_bg}
        - {op: in, fact: self.status_in_bg, values: [visa_d, long_term, permanent, protection]}
    reason: "Продление или смена уже имеющегося статуса бот пока не проверяет — нужен индивидуальный разбор."
summary: >-
  Основание для тех, кто работает удалённо на работодателя или клиентов за пределами ЕС и не работает на лиц в Болгарии.
  Подходят три формата: работа по трудовому договору, собственная компания с долей больше 25% и фриланс не меньше года.
  Нужен достаточный годовой доход за прошлый календарный год.
requirements:
  - id: form
    label: "Формат работы подходит: наёмный работник иностранного работодателя вне ЕС, владелец компании вне ЕС (доля больше 25%) или фрилансер не меньше года, без работы на клиентов в Болгарии"
    cond:
      op: or
      any:
        - op: and
          all:
            - {op: in, fact: self.income_sources, values: [remote_employee]}
            - {op: known_true, fact: self.employer_outside_eu}
        - op: and
          all:
            - {op: in, fact: self.income_sources, values: [own_company_abroad]}
            - {op: known_true, fact: self.company_outside_eu}
            - {op: known_true, fact: self.company_share_over_25}
            - {op: not, cond: {op: known_true, fact: self.clients_in_bg}}
        - op: and
          all:
            - {op: in, fact: self.income_sources, values: [freelance_foreign]}
            - {op: known_true, fact: self.freelance_one_year}
            - {op: not, cond: {op: known_true, fact: self.clients_in_bg}}
    kind: legal
    stage: any
    on_fail: not_eligible
    fail_text: "Основание доступно только удалённым работникам по найму у работодателя вне ЕС, владельцам компаний вне ЕС с долей больше 25% и фрилансерам с опытом удалённой работы не меньше года; работа на клиентов в Болгарии исключает основание."
    unknown_text: "Уточните формат работы, регистрацию работодателя или компании и клиентов в Болгарии."
    source_ids: [zchrb, dv_2025_052]
    verified: false
    research_status: consolidated
    research_note: >-
      § 1 т. 36 ДР ЗЧРБ. Вариант 1: «е нает с трудов договор от работодател, регистриран/учреден извън държава - членка на Европейския съюз».
      Вариант 2: «притежаващ повече от 25 на сто от капитала на дружество», не работи и не оказывает услуги лицам в РБ.
      Вариант 3: «за период не по-малко от една година преди датата на подаване на заявлението».
      Запрет на работу для лиц в Болгарии: «не извършва работа и/или предоставя услуги на лица на територията на Република България» (для варианта 1 такого условия в формулировке нет).
      Бот считает работу на клиентов в Болгарии препятствием только когда ответ подтверждённо «нет клиентов»: неизвестный ответ даёт «неизвестно».
  - id: income
    label: "Доход за прошлый календарный год не меньше {param:dn_income_year} (50 минимальных зарплат, брутто)"
    cond: {op: cmp, fact: self.income_prev_year_eur, cmp: ">=", param: dn_income_year}
    kind: legal
    stage: any
    on_fail: individual_review
    fail_text: "Доход ниже расчётного порога. Закон не уточняет, минимальную зарплату какого года брать для расчёта, поэтому такой случай оценивается индивидуально."
    unknown_text: "Уточните доход за прошлый календарный год до налогов."
    source_ids: [zchrb]
    verified: false
    research_status: unconfirmed
    research_note: >-
      чл. 24с ал. 1 ЗЧРБ: «не по-малък от 50 (петдесет) минимални месечни работни заплати ... за предходната календарна година»,
      «брутната сума на придобитите доходи». Формула подтверждена, сумма в евро — нет: при МРЗ-2026 это 31 010 евро, при МРЗ предыдущего года около 27 533 евро; официального разъяснения не найдено.
  - id: housing
    label: "Есть подтверждённое жильё в Болгарии"
    cond: {op: known_true, fact: case.has_housing}
    kind: legal
    stage: permit
    on_fail: possible_after
    fail_text: "Нужно оформить жильё: договор аренды или документ о собственности."
    unknown_text: "Уточните, есть ли жильё в Болгарии."
    source_ids: [zchrb, ppzchrb]
    verified: false
    research_status: consolidated
    research_note: "чл. 24с ал. 1 ЗЧРБ: «освен при наличие на условията, предвидени в чл. 24, ал. 2»; чл. 14 ал. 1 т. 3 ППЗЧРБ: «доказателства за осигурено жилище»."
restrictions:
  - text: "Работать на лиц в Болгарии или оказывать им услуги по этому основанию нельзя: это нарушает условия основания."
    kind: legal
  - text: "Разрешение выдаётся на один год и может быть продлено один раз ещё на один год."
    kind: legal
  - text: "Сначала нужна виза D (консульство Болгарии), затем ВНЖ подаётся в Болгарии по тому же основанию."
    kind: legal
  - text: "Регистрационные документы работодателя или компании не должны быть старше 6 месяцев на дату подачи."
    kind: legal
practice_notes:
  - text: "Весь процесс обычно занимает несколько месяцев, виза D оформляется не быстрее нескольких недель."
    scope: "по данным BGINFO; сроки в законе не установлены"
    kind: practice
  - text: "BGINFO называет порог дохода примерно на уровне 50 минимальных зарплат, но способ расчёта на странице не приведён."
    scope: "по данным BGINFO"
    kind: practice
  - text: "Обсуждается законопроект об изменении закона об иностранцах, в том числе продления для цифровых кочевников; изменения пока не действуют."
    scope: "на дату проверки"
    kind: practice
documents:
  - "Загранпаспорт"
  - "Документы, подтверждающие доход за прошлый календарный год"
  - "Трудовой договор с работодателем вне ЕС или регистрационные документы компании (не старше 6 месяцев)"
  - "Для владельцев компаний и фрилансеров: договор и референс получателя услуг"
  - "Документ о жилье (аренда или собственность)"
  - "Медицинская страховка"
  - "Справка о несудимости (при первичной подаче)"
steps:
  - "Подтвердить формат работы и собрать документы о доходе и работодателе или компании."
  - "Подать на визу D в консульстве Болгарии."
  - "После въезда подать заявление на ВНЖ в дирекцию «Миграция» (решение — до 14 дней, может быть продлено на месяц)."
  - "Подать на продление не позднее чем за 14 дней до окончания срока."
family_note: "Отдельных норм о членах семьи цифрового кочевника в прочитанных статьях закона нет; применяются общие правила для членов семьи (на практике не проверено). BGINFO пишет, что можно рассматривать ВНЖ для членов семьи."
goals: [live, work]
bginfo_source_ids: [bg_digital_nomad, bg_tp_dn_diff]
