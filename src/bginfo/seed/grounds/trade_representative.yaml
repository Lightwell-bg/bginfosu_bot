# Статус draft, все требования verified=false: одобрение и публикацию выполняет владелец в админке.
id: trade_representative
title: "ВНЖ для представителя иностранной компании (торговое представительство)"
regime: third_country
subject: applicant
status: draft
version: 1
research_note: >-
  Исследование 2026-10-09 (docs/research/KB_RESEARCH.md, раздел 2.2). Основание — чл. 24 ал. 1 т. 6 ЗЧРБ (изм. ДВ бр. 52/2025);
  ППЗЧРБ чл. 19. BGINFO на странице о ЗЧРБ называет этот пункт «п. 7», на странице о представительстве — «т. 6»; опора на т. 6.
  Текст закона читался в консолидации Ciela; ДВ бр. 52/2025 открывался напрямую.
applies_if:
  op: and
  all:
    - {op: in, fact: self.citizenship_group, values: [third]}
    - {op: not, cond: {op: in, fact: self.citizenship_group, values: [bg, eu]}}
unsupported:
  - cond:
      op: and
      all:
        - {op: eq, fact: case.who_moves, value: already_in_bg}
        - {op: in, fact: self.status_in_bg, values: [visa_d, long_term, permanent, protection]}
    reason: "Продление или смена уже имеющегося статуса бот пока не проверяет — нужен индивидуальный разбор."
summary: >-
  Основание для человека, которого иностранная компания назначает своим представителем в Болгарии. Компания открывает
  и регистрирует в Болгарии торговое представительство, а его представитель получает ВНЖ. Нужна налоговая исправность
  компании и достаточный оборот за два года подряд.
requirements:
  - id: has_link
    label: "Есть связь с иностранной компанией (владелец, руководитель или сотрудник), которая может назначить представителя"
    cond: {op: in, fact: self.income_sources, values: [own_company_abroad, remote_employee]}
    kind: legal
    stage: any
    on_fail: not_eligible
    fail_text: "Основание доступно только представителю иностранной компании, зарегистрировавшей торговое представительство в Болгарии."
    source_ids: [zchrb]
    verified: false
    research_status: consolidated
    research_note: "чл. 24 ал. 1 т. 6 ЗЧРБ: «до двама представители на чуждестранното търговско дружество»."
  - id: company_ready
    label: "Компания готова открыть и зарегистрировать торговое представительство в Болгарии"
    cond: {op: known_true, fact: self.rep_company_ready}
    kind: procedure
    stage: permit
    on_fail: not_eligible
    fail_text: "Без регистрации торгового представительства в Торгово-промышленной палате основание недоступно."
    unknown_text: "Уточните, может ли компания открыть представительство в Болгарии."
    source_ids: [zchrb, ppzchrb]
    verified: false
    research_status: consolidated
    research_note: "чл. 19 т. 1 ППЗЧРБ: «сертификат за актуална регистрация на търговското представителство в Българската търговско-промишлена палата, издаден не по-рано от един месец»."
  - id: turnover
    label: "Годовой оборот компании не меньше {param:trade_rep_turnover} в каждом из двух последних лет подряд"
    cond: {op: known_true, fact: self.rep_turnover_ok}
    kind: legal
    stage: permit
    on_fail: not_eligible
    fail_text: "Оборот компании ниже порога, установленного законом."
    unknown_text: "Уточните оборот компании за два последних года."
    source_ids: [zchrb]
    verified: false
    research_status: consolidated
    research_note: "чл. 24 ал. 1 т. 6 ЗЧРБ: «годишен оборот в размер най-малко на 100 000 лева» за каждый из 2 последовательных лет до регистрации; закон допускает эквивалент в иностранной валюте по курсу БНБ."
  - id: tax
    label: "У компании нет налоговых долгов (налоговая исправность)"
    cond: {op: known_true, fact: self.rep_tax_clean}
    kind: legal
    stage: permit
    on_fail: possible_after
    fail_text: "Нужно урегулировать налоговые обязательства компании и получить подтверждающие документы."
    unknown_text: "Уточните, нет ли у компании налоговых долгов."
    source_ids: [zchrb, dv_2025_052]
    verified: false
    research_status: official_publication
    research_note: "чл. 24 ал. 1 т. 6 ЗЧРБ (ДВ бр. 52/2025, прочитан напрямую): «данъчна изрядност»."
  - id: housing
    label: "Есть подтверждённое жильё в Болгарии"
    cond: {op: known_true, fact: case.has_housing}
    kind: legal
    stage: permit
    on_fail: possible_after
    fail_text: "Нужно оформить жильё: договор аренды или документ о собственности."
    unknown_text: "Уточните, есть ли жильё в Болгарии."
    source_ids: [ppzchrb]
    verified: false
    research_status: consolidated
    research_note: "чл. 14 ал. 1 т. 3 ППЗЧРБ: «доказателства за осигурено жилище»."
restrictions:
  - text: "От одной компании ВНЖ могут получить не более двух представителей."
    kind: legal
  - text: "Сначала нужна виза D (консульство Болгарии), затем ВНЖ подаётся в Болгарии по тому же основанию."
    kind: legal
  - text: "Компания, которая уже зарегистрировала торговое представительство, должна привести обстоятельства регистрации в соответствие с изменениями закона в течение двух лет со вступления в силу изменений (переходный период, § 43 ПЗР к ДВ бр. 52/2025)."
    kind: legal
  - text: "При продлении нужен новый сертификат палаты после декларации о деятельности и доказательства офиса, представительских действий и/или отношений с болгарскими партнёрами."
    kind: legal
  - text: "Об изменениях компания уведомляет палату в 30-дневный срок, представительство — в 7-дневный."
    kind: legal
practice_notes:
  - text: "Торговое представительство не является болгарским юридическим лицом и не вправе вести хозяйственную деятельность."
    scope: "по данным BGINFO"
    kind: practice
  - text: "Палата обычно просит договор аренды офиса не меньше чем на год с нотариально заверенной подписью арендодателя и программу деятельности на календарный год."
    scope: "по данным BGINFO; в законе не найдено"
    kind: practice
  - text: "По данным BGINFO, ВНЖ через представительство и виза для цифровых кочевников — разные пути с разными условиями."
    scope: "по данным BGINFO"
    kind: practice
  - text: "Обсуждается законопроект об изменении закона об иностранцах; изменения пока не действуют."
    scope: "на дату проверки"
    kind: practice
documents:
  - "Загранпаспорт"
  - "Решение органа компании об открытии представительства"
  - "Удостоверение об актуальном состоянии компании (выдано не раньше чем за 6 месяцев до подачи)"
  - "Документы об отсутствии налоговых долгов и об обороте компании"
  - "Нотариальная доверенность и образцы подписей"
  - "Сертификат об актуальной регистрации представительства в Торгово-промышленной палате (выдан не раньше чем за месяц до подачи)"
  - "Документ о жилье (аренда или собственность)"
  - "Медицинская страховка"
  - "Справка о несудимости (при первичной подаче)"
  - "Переводы и легализация или апостиль иностранных документов"
steps:
  - "Проверить компанию и подготовить корпоративные документы, перевести и легализовать их."
  - "Зарегистрировать торговое представительство в Торгово-промышленной палате."
  - "Подать на визу D в консульстве Болгарии."
  - "После въезда подать заявление на ВНЖ в дирекцию «Миграция» (решение — до 14 дней, может быть продлено на месяц)."
family_note: "Супруг(а) и дети не получают ВНЖ автоматически — для них отдельная процедура как для членов семьи иностранца с видом на жительство."
goals: [live, work]
bginfo_source_ids: [bg_trade_rep, bg_tp_dn_diff]
