# Статус draft, все требования verified=false: одобрение и публикацию выполняет владелец в админке.
id: work_single_permit
title: "Единое разрешение на пребывание и работу"
regime: third_country
subject: applicant
status: draft
version: 1
research_note: >-
  Исследование 2026-10-09 (docs/research/KB_RESEARCH.md, раздел 2.4). Основание — чл. 24и ЗЧРБ, чл. 7 ЗТМТМ, ППЗЧРБ.
  Тексты читались в консолидации Ciela; ДВ не открывался.
applies_if:
  op: and
  all:
    - {op: in, fact: self.citizenship_group, values: [third]}
    - {op: not, cond: {op: in, fact: self.citizenship_group, values: [bg, eu]}}
unsupported:
  - cond:
      op: and
      all:
        - {op: eq, fact: case.who_moves, value: already_in_bg}
        - {op: in, fact: self.status_in_bg, values: [visa_d, long_term, permanent, protection]}
    reason: "Продление или смена уже имеющегося статуса бот пока не проверяет — нужен индивидуальный разбор."
summary: >-
  Основание для наёмного работника болгарского работодателя. Заявление подаёт работодатель, разрешение привязано
  к работодателю, должности и месту работы. Выдаётся на срок до трёх лет.
requirements:
  - id: offer
    label: "Есть предложение работы от работодателя в Болгарии"
    cond: {op: in, fact: self.income_sources, values: [job_offer_bg]}
    kind: legal
    stage: any
    on_fail: not_eligible
    fail_text: "Основание доступно только при наличии работодателя в Болгарии, который подаёт заявление и заключает срочный трудовой договор."
    source_ids: [zchrb, ztmtm]
    verified: false
    research_status: consolidated
    research_note: "чл. 24и ал. 5 ЗЧРБ: «срочен трудов договор за длъжност с код по Националната класификация на професиите»; чл. 7 ал. 2 ЗТМТМ: разрешение «само за местния работодател»."
  - id: skills
    label: "Есть образование или опыт для предлагаемой должности"
    cond: {op: known_true, fact: self.job_skills}
    kind: legal
    stage: permit
    on_fail: individual_review
    fail_text: "Если образования или опыта для должности недостаточно, шансы оцениваются индивидуально."
    unknown_text: "Уточните, есть ли образование или опыт для должности."
    source_ids: [ztmtm]
    verified: false
    research_status: consolidated
    research_note: "чл. 7 ал. 1 т. 3 ЗТМТМ: «специализирани знания, умения и професионален опит»."
restrictions:
  - text: "Условия работодателя проверяет сам работодатель и Агенция по заетостта: доля работников из третьих стран за предыдущие 12 месяцев не больше 20% (для малых и средних предприятий — 35%)."
    kind: legal
  - text: "Условия труда и оплата не могут быть хуже, чем для граждан Болгарии на аналогичной должности; это тоже проверяет работодатель и Агенция по заетостта."
    kind: legal
  - text: "Разрешение выдаётся на срок до 3 лет (если договор короче — на срок договора) и привязано к работодателю, месту и должности."
    kind: legal
  - text: "Вся процедура рассмотрения обычно занимает до двух месяцев, при сложностях ещё до двух месяцев."
    kind: legal
  - text: "Для регулируемых профессий нужен документ о выполнении условий, диплом после въезда признаётся через центр информации и документации."
    kind: legal
practice_notes:
  - text: "Льготного периода на поиск новой работы при потере места пока нет: поправки не вступили в силу."
    scope: "по данным BGINFO"
    kind: practice
  - text: "Обсуждается законопроект об изменении закона об иностранцах (в том числе о периоде безработицы для держателей единого разрешения); изменения пока не действуют."
    scope: "на дату проверки"
    kind: practice
  - text: "Разрешение не даёт права работать в других странах ЕС и у другого работодателя без отдельной процедуры."
    scope: "по данным BGINFO"
    kind: practice
documents:
  - "Загранпаспорт"
  - "Срочный трудовой договор с кодом должности по классификации профессий"
  - "Обоснование найма от работодателя и документы о численности работников"
  - "Документ об образовании или опыте (с переводом и легализацией)"
  - "Документ о жилье (аренда или собственность)"
  - "Медицинская страховка (не меньше чем на 3 месяца)"
  - "Справка о несудимости (при первичной подаче)"
steps:
  - "Найти работодателя в Болгарии и заключить срочный трудовой договор."
  - "Работодатель подаёт заявление в «Миграцию», проверки проводят Агенция по заетостта и другие органы."
  - "После одобрения получить визу D в консульстве Болгарии."
  - "После въезда явиться в «Миграцию» в течение 14 дней и получить разрешение."
family_note: "Члены семьи не получают разрешение автоматически — для них отдельная процедура как для членов семьи иностранца с видом на жительство."
goals: [work, live]
bginfo_source_ids: [bg_single_permit]
