# Статус draft, все требования verified=false: одобрение и публикацию выполняет владелец в админке.
id: family_of_bg_citizen
title: "ВНЖ для члена семьи гражданина Болгарии"
regime: family_third_country
subject: applicant
status: draft
version: 1
research_note: >-
  Исследование 2026-10-09 (docs/research/KB_RESEARCH.md, раздел 2.3). Основание — чл. 24 ал. 1 т. 18 ЗЧРБ, определение членов семьи — чл. 2 ал. 6; ППЗЧРБ чл. 29.
  Тексты читались в консолидации Ciela; ДВ не открывался. Бот проверяет супруга(у) болгарского гражданина; остальные члены семьи (потомки и восходящие) требуют индивидуального разбора.
applies_if:
  op: and
  all:
    - {op: in, fact: self.citizenship_group, values: [third]}
    - {op: not, cond: {op: in, fact: self.citizenship_group, values: [bg, eu]}}
unsupported:
  - cond:
      op: and
      all:
        - {op: eq, fact: case.who_moves, value: already_in_bg}
        - {op: in, fact: self.status_in_bg, values: [visa_d, long_term, permanent, protection]}
    reason: "Продление или смена уже имеющегося статуса бот пока не проверяет — нужен индивидуальный разбор."
summary: >-
  Основание для супруга(и) гражданина Болгарии, который(ая) не является гражданином ЕС. Закон охватывает и других членов семьи
  болгарского гражданина — потомков до 21 года (старше — если на содержании или по состоянию здоровья), восходящих и иных
  членов домохозяйства на содержании: для них бот не делает расчёт, нужен индивидуальный разбор.
requirements:
  - id: spouse_bg
    label: "Супруг(а) — гражданин(ка) Болгарии"
    cond: {op: in, fact: self.ties, values: [spouse_bg]}
    kind: legal
    stage: any
    on_fail: not_eligible
    fail_text: "Бот проверяет только случай, когда супруг(а) — гражданин(ка) Болгарии. Для других членов семьи болгарского гражданина нужен индивидуальный разбор."
    source_ids: [zchrb, ppzchrb]
    verified: false
    research_status: consolidated
    research_note: "чл. 2 ал. 6 ЗЧРБ: «Членове на семейството на български гражданин ... са лицата, които живеят с него в едно домакинство»; чл. 24 ал. 1 т. 18 ЗЧРБ; чл. 29 ППЗЧРБ."
  - id: housing
    label: "Есть подтверждённое жильё в Болгарии"
    cond: {op: known_true, fact: case.has_housing}
    kind: legal
    stage: permit
    on_fail: possible_after
    fail_text: "Нужно оформить жильё: договор аренды или документ о собственности."
    unknown_text: "Уточните, есть ли жильё в Болгарии."
    source_ids: [ppzchrb]
    verified: false
    research_status: consolidated
    research_note: "чл. 14 ал. 1 т. 3 ППЗЧРБ: «доказателства за осигурено жилище»."
restrictions:
  - text: "Нужна виза D (консульство Болгарии); дети, рождённые в Болгарии, подают без визы."
    kind: legal
  - text: "Если брак распался или супруг(а) умер(ла), самостоятельный ВНЖ даётся один раз при условии, что семья законно и непрерывно жила в Болгарии не менее двух лет."
    kind: legal
  - text: "Родители гражданина Болгарии могут получить ВНЖ, если они финансово обеспечены (отдельное основание, требует индивидуального разбора)."
    kind: legal
practice_notes:
  - text: "Возраст детей в изложении BGINFO — до 18 лет, тогда как закон для семьи болгарского гражданина берёт 21 год."
    scope: "расхождение найдено при проверке: в боте опора на закон"
    kind: practice
documents:
  - "Загранпаспорт"
  - "Свидетельство о браке или рождении (с переводом и легализацией)"
  - "Документы супруга(и) — гражданина Болгарии"
  - "Документ о жилье (аренда или собственность)"
  - "Медицинская страховка"
  - "Справка о несудимости (при первичной подаче)"
steps:
  - "Подготовить свидетельство о браке с переводом и легализацией."
  - "Подать на визу D в консульстве Болгарии."
  - "После въезда подать заявление на ВНЖ в дирекцию «Миграция»."
  - "Продлевать, подавая заявление не позднее чем за 14 дней до окончания срока."
family_note: "Закон охватывает и других членов семьи болгарского гражданина (потомков до 21 года, восходящих) — для них индивидуальный разбор."
goals: [family, live, long_term]
bginfo_source_ids: [bg_family]
