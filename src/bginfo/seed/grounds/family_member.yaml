# Статус draft, все требования verified=false: одобрение и публикацию выполняет владелец в админке.
# Основание для члена семьи, который переезжает с основным заявителем или к нему.
id: family_member
title: "ВНЖ для члена семьи иностранца с видом на жительство (воссоединение)"
regime: family_third_country
subject: family_member
status: draft
version: 1
research_note: >-
  Исследование 2026-10-09 (docs/research/KB_RESEARCH.md, раздел 2.3). Основание — чл. 24 ал. 1 т. 13 ЗЧРБ, определение членов семьи — чл. 2 ал. 3-6;
  воссоединение — гл. 3 «а», чл. 33ф. Тексты читались в консолидации Ciela; ДВ не открывался.
  Права работать членов семьи (кроме семьи держателя Синей карты) в отчёте не разбирались.
applies_if:
  op: and
  all:
    - {op: in, fact: self.citizenship_group, values: [third]}
    - {op: not, cond: {op: in, fact: self.citizenship_group, values: [bg, eu]}}
unsupported:
  - cond: {op: in, fact: sponsor.citizenship_group, values: [eu]}
    reason: "Члены семьи граждан ЕС — отдельный режим, нужен индивидуальный разбор."
summary: >-
  Основание для супруга(и) и несовершеннолетних детей, которые переезжают вместе с основным заявителем или к нему,
  если у основного заявителя есть или может появиться ВНЖ, постоянное пребывание или международная защита.
  Взрослые дети и родители оцениваются индивидуально.
requirements:
  - id: relation
    label: "Родство подходит: супруг(а) или несовершеннолетний ребёнок"
    cond:
      op: or
      any:
        - {op: eq, fact: self.relation, value: spouse}
        - op: and
          all:
            - {op: eq, fact: self.relation, value: child}
            - {op: eq, fact: self.child_adult, value: false}
    kind: legal
    stage: any
    on_fail: individual_review
    fail_text: "Для взрослых детей, родителей и других родственников требуется индивидуальный разбор."
    unknown_text: "Уточните родство и возраст ребёнка."
    source_ids: [zchrb]
    verified: false
    research_status: consolidated
    research_note: "чл. 2 ал. 3 ЗЧРБ: «Членове на семейство на чужденец са лицата, които живеят с него в едно домакинство» (супруг(а), дети до 18 лет, не состоящие в браке); дети старше 18 лет по состоянию здоровья — чл. 2 ал. 4."
  - id: sponsor
    label: "У основного заявителя есть или может появиться ВНЖ, постоянное пребывание или международная защита"
    cond: {op: sponsor_basis, statuses: [long_term, permanent, protection]}
    kind: legal
    stage: any
    on_fail: not_eligible
    fail_text: "Пока у основного заявителя нет подходящего основания, члену семьи оформлять нечего."
    unknown_text: "Сначала нужно выяснить, получит ли основной заявитель ВНЖ."
    source_ids: [zchrb]
    verified: false
    research_status: consolidated
    research_note: "чл. 24 ал. 1 т. 13 ЗЧРБ: «са членове на семейството на чужденец, получил разрешение за продължително или за постоянно пребиваване»."
  - id: sponsor_one_year
    label: "У основного заявителя пребывание в Болгарии разрешено не меньше чем на год (или ПМЖ / защита)"
    cond:
      op: or
      any:
        - {op: in, fact: sponsor.status_in_bg, values: [permanent, protection]}
        - op: and
          all:
            - {op: eq, fact: sponsor.status_in_bg, value: long_term}
            - {op: known_true, fact: sponsor.sponsor_permit_1y}
    kind: legal
    stage: permit
    on_fail: possible_after
    fail_text: "Сначала ВНЖ получает основной заявитель. Воссоединение семьи по чл. 33ф возможно, когда его пребывание разрешено не меньше чем на год."
    unknown_text: "Уточните срок разрешения на пребывание основного заявителя."
    source_ids: [zchrb]
    verified: false
    research_status: consolidated
    research_note: "чл. 33ф ал. 1 ЗЧРБ: «чужденецът с разрешено пребиваване не по-малко от една година»."
  - id: docs
    label: "Есть документ о браке или рождении"
    cond: {op: known_true, fact: self.relation_docs}
    kind: procedure
    stage: permit
    on_fail: possible_after
    fail_text: "Нужно получить свидетельство о браке или рождении, перевести и легализовать его."
    unknown_text: "Уточните, есть ли документ о браке или рождении."
    source_ids: [zchrb]
    verified: false
    research_status: consolidated
    research_note: "чл. 33ф ал. 1 ЗЧРБ (среди документов — свидетельство о браке или рождении, отчёт раздел 2.3, строка 5); отдельной дословной цитаты по этому пункту в отчёте нет."
  - id: housing
    label: "Есть подтверждённое жильё в Болгарии"
    cond: {op: known_true, fact: case.has_housing}
    kind: legal
    stage: permit
    on_fail: possible_after
    fail_text: "Нужно оформить жильё: договор аренды или документ о собственности."
    unknown_text: "Уточните, есть ли жильё в Болгарии."
    source_ids: [zchrb, ppzchrb]
    verified: false
    research_status: consolidated
    research_note: "чл. 33ф ал. 1 ЗЧРБ (жильё в числе условий воссоединения); чл. 14 ал. 1 т. 3 ППЗЧРБ: «доказателства за осигурено жилище»."
restrictions:
  - text: "Первое разрешение члену семьи, как правило, не может быть выдано на срок больше срока разрешения основного заявителя."
    kind: practice
    scope: "по данным BGINFO; в законе подтверждено для семьи долгосрочно пребывающего"
  - text: "Воссоединение семьи идёт через «Миграцию» по чл. 33ф: у основного заявителя должно быть разрешённое пребывание не меньше года."
    kind: legal
  - text: "Паспорт члена семьи должен быть действителен не меньше 6 месяцев; решение по воссоединению принимается в срок до одного месяца после согласования со службой безопасности."
    kind: legal
  - text: "После одобрения воссоединения визы членам семьи выдаются по облегчённой процедуре."
    kind: legal
  - text: "Нельзя воссоединить второго супруга(у), если уже есть супруг(а), проживающий(ая) в Болгарии."
    kind: legal
practice_notes:
  - text: "К пакету обычно добавляют нотариальное обязательство основного заявителя обеспечить жильё и содержание, а также копию его карты."
    scope: "по данным BGINFO"
    kind: practice
  - text: "Государственные сборы за воссоединение и визу D для семьи по данным BGINFO невелики и зависят от возраста детей."
    scope: "по данным BGINFO; размеры сборов не проверялись"
    kind: practice
documents:
  - "Загранпаспорт (действителен не меньше 6 месяцев)"
  - "Свидетельство о браке или рождении (с переводом и легализацией)"
  - "Документ о жилье (аренда или собственность)"
  - "Документы о средствах на содержание"
  - "Медицинская страховка"
  - "Справка о несудимости (при первичной подаче, для взрослых)"
steps:
  - "Основной заявитель подаёт заявление на воссоединение семьи в «Миграцию» (чл. 33ф)."
  - "После одобрения член семьи получает визу D по облегчённой процедуре."
  - "После въезда подать заявление на ВНЖ в дирекцию «Миграция»."
family_note: "Работа членов семьи по этому основанию отдельно не проверялась; для членов семьи держателя Синей карты ЕС право работать прямо предусмотрено законом."
goals: [family, live]
bginfo_source_ids: [bg_family]
