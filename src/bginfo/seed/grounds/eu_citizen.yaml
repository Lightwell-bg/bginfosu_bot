# Статус draft, все требования verified=false: одобрение и публикацию выполняет владелец в админке.
id: eu_citizen
title: "Пребывание гражданина ЕС, ЕЭЗ или Швейцарии"
regime: eu
subject: applicant
status: draft
version: 1
research_note: >-
  Исследование 2026-10-09 (docs/research/KB_RESEARCH.md, раздел 2.10). Основание — закон о влизането, пребиваването и напускането
  на Република България на гражданите на ЕС и членовете на техните семейства (чл. 6, 7, 8, 9, 16). Текст читался в консолидации Ciela.
  Отдельная статья BGINFO не найдена при проверке: ссылка на общий раздел о ВНЖ. Размеры сборов и инструкция МВР не проверялись;
  вступление в силу части изменений ДВ бр. 52/2025 (§ 54 ал. 2) на 2026-10-09 не проверено.
applies_if:
  op: and
  all:
    - {op: in, fact: self.citizenship_group, values: [eu]}
    - {op: not, cond: {op: in, fact: self.citizenship_group, values: [bg]}}
summary: >-
  Гражданину ЕС виза D не нужна. До трёх месяцев можно находиться по паспорту или удостоверению личности, а для более долгого
  пребывания в течение трёх месяцев после въезда подаётся заявление на документ о пребывании. Нужно работать, либо иметь
  медицинскую страховку и достаточные средства, либо учиться со страховкой и средствами.
requirements:
  - id: activity
    label: "Есть подходящее занятие: работа (по найму или на себя), жизнь на свои средства со страховкой или учёба со страховкой и средствами"
    cond: {op: in, fact: self.eu_activity, values: [work, means, study]}
    kind: legal
    stage: permit
    on_fail: not_eligible
    fail_text: "Для пребывания дольше трёх месяцев нужно работать, иметь страховку и средства или учиться."
    unknown_text: "Уточните, чем вы будете заниматься в Болгарии."
    source_ids: [zeu]
    verified: false
    research_status: consolidated
    research_note: "чл. 8 ал. 1 ЗВПНРБГЕСЧС: «притежава здравна осигуровка и необходимите финансови средства ... без да са в тежест на системата за социално подпомагане»; числовой порог средств в законе не указан."
restrictions:
  - text: "Заявление нужно подать в течение 3 месяцев со дня въезда; документ выдаётся в день подачи, на устранение недостатков даётся 7 дней."
    kind: legal
  - text: "Документ о пребывании выдаётся на 5 лет или на запрошенный срок, если он короче."
    kind: legal
  - text: "Визу D получать не нужно: гражданин ЕС въезжает по паспорту или удостоверению личности."
    kind: legal
  - text: "Постоянное пребывание возможно после 5 лет законного и непрерывного пребывания."
    kind: legal
  - text: "Члены семьи — не граждане ЕС получают разрешение на пребывание по отдельному порядку; другие члены семьи (на иждивении, при фактическом совместном проживании) — после проверки обстоятельств."
    kind: legal
practice_notes:
  - text: "Обсуждается законопроект об изменении закона об иностранцах; изменения пока не действуют."
    scope: "на дату проверки"
    kind: practice
documents:
  - "Паспорт или удостоверение личности"
  - "Подтверждение занятия: трудовой договор, регистрация самозанятого или документ о зачислении на учёбу"
  - "Медицинская страховка"
  - "Документы о достаточных средствах (для тех, кто живёт на свои средства или учится)"
steps:
  - "Въехать в Болгарию по паспорту или удостоверению личности."
  - "В течение 3 месяцев подать заявление на документ о пребывании в «Миграцию» или районное управление МВД."
  - "Получить документ о пребывании (на 5 лет или на запрошенный срок)."
family_note: "Члены семьи гражданина ЕС получают право на пребывание по этому же закону; для членов семьи — не граждан ЕС выдаётся отдельное разрешение на пребывание."
goals: [live, work, study, long_term]
bginfo_source_ids: [bg_rp_hub]
