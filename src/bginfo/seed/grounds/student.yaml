# Статус draft, все требования verified=false: одобрение и публикацию выполняет владелец в админке.
id: student
title: "ВНЖ для студентов (очное обучение в вузе Болгарии)"
regime: third_country
subject: applicant
status: draft
version: 1
research_note: >-
  Исследование 2026-10-09 (docs/research/KB_RESEARCH.md, раздел 2.7). Основание — чл. 24в ЗЧРБ, чл. 38 ЗТМТМ.
  Тексты читались в консолидации Ciela; ДВ не открывался. Студенты болгарского происхождения идут без визы D (чл. 24в ал. 3).
applies_if:
  op: and
  all:
    - {op: in, fact: self.citizenship_group, values: [third]}
    - {op: not, cond: {op: in, fact: self.citizenship_group, values: [bg, eu]}}
unsupported:
  - cond:
      op: and
      all:
        - {op: eq, fact: case.who_moves, value: already_in_bg}
        - {op: in, fact: self.status_in_bg, values: [visa_d, long_term, permanent, protection]}
    reason: "Продление или смена уже имеющегося статуса бот пока не проверяет — нужен индивидуальный разбор."
summary: >-
  Основание для тех, кого приняли на очную форму обучения в вуз Болгарии. Нужны подтверждение о зачислении,
  жильё, медицинская страховка и средства на жизнь.
requirements:
  - id: study
    label: "Планируется учёба в болгарском вузе"
    cond: {op: in, fact: self.ties, values: [study]}
    kind: legal
    stage: any
    on_fail: not_eligible
    fail_text: "Основание доступно только тем, кто поступает или учится в вузе Болгарии."
    source_ids: [zchrb]
    verified: false
    research_status: consolidated
    research_note: "чл. 24в ал. 1 ЗЧРБ: «приети като студенти в редовна форма на обучение във висше училище в Република България»."
  - id: full_time
    label: "Обучение очное (дневная форма)"
    cond: {op: known_true, fact: self.full_time_study}
    kind: legal
    stage: any
    on_fail: not_eligible
    fail_text: "Заочное и дистанционное обучение основания не даёт."
    unknown_text: "Уточните, очное ли обучение."
    source_ids: [zchrb]
    verified: false
    research_status: consolidated
    research_note: "чл. 24в ал. 1 ЗЧРБ: «в редовна форма на обучение»."
  - id: admitted
    label: "Есть подтверждение о зачислении в вуз (удостоверение министерства образования)"
    cond: {op: known_true, fact: self.study_admitted}
    kind: procedure
    stage: permit
    on_fail: possible_after
    fail_text: "Нужно получить зачисление и документ о приёме на обучение."
    unknown_text: "Уточните, есть ли подтверждение о зачислении."
    source_ids: [zchrb]
    verified: false
    research_status: consolidated
    research_note: "чл. 24в ал. 2 т. 6 ЗЧРБ: «удостоверение за приемането му за обучение ... издадено от Министерството на образованието и науката»."
  - id: housing
    label: "Есть подтверждённое жильё в Болгарии"
    cond: {op: known_true, fact: case.has_housing}
    kind: legal
    stage: permit
    on_fail: possible_after
    fail_text: "Нужно оформить жильё: договор аренды или документ о собственности."
    unknown_text: "Уточните, есть ли жильё в Болгарии."
    source_ids: [zchrb]
    verified: false
    research_status: consolidated
    research_note: "чл. 24в ал. 2 т. 2-5 ЗЧРБ (жильё, мед. страховка, средства, судимость); отдельной короткой цитаты по жилью в отчёте нет."
restrictions:
  - text: "Подрабатывать по трудовому договору можно до 20 часов в неделю в учебный год и в каникулы вуза; работодатель регистрирует работника в Агенции по заетостта в течение 7 дней."
    kind: legal
  - text: "Разрешение выдаётся до 1 года, на последний год обучения — на 18 месяцев."
    kind: legal
  - text: "Для постоянного пребывания и статуса долгосрочно пребывающего учитывается только половина срока учёбы."
    kind: legal
  - text: "После окончания вуза можно получить разрешение до 9 месяцев на поиск работы: заявление не менее чем за 30 дней до окончания срока и регистрация в Агенции по заетостта в течение 7 рабочих дней."
    kind: legal
practice_notes:
  - text: "Решение по визе D обычно принимают в течение нескольких дней, требуется личная явка и медицинская страховка."
    scope: "по данным BGINFO; сумму покрытия закон не называет"
    kind: practice
  - text: "Фриланс не подпадает под упрощённый режим для студентов."
    scope: "по данным BGINFO"
    kind: practice
documents:
  - "Загранпаспорт"
  - "Документ о приёме на обучение и справка вуза"
  - "Удостоверение министерства образования о приёме на обучение"
  - "Документы о средствах на жизнь"
  - "Документ о жилье (аренда или собственность)"
  - "Медицинская страховка (если нет страхования по болгарскому закону)"
  - "Справка о несудимости (при первичной подаче)"
steps:
  - "Поступить в вуз и получить подтверждение о зачислении."
  - "Подать на визу D в консульстве Болгарии."
  - "После въезда подать заявление на ВНЖ в дирекцию «Миграция»."
  - "Ежегодно продлевать, подавая заявление не позднее чем за 14 дней до окончания срока."
family_note: "В статье о студентах нормы о членах семьи нет; для супруга(и) и детей применяются общие правила для членов семьи иностранца с видом на жительство."
goals: [study, live]
bginfo_source_ids: [bg_student]
