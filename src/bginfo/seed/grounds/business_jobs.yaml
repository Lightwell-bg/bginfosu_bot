# Статус draft, все требования verified=false: одобрение и публикацию выполняет владелец в админке.
id: business_jobs
title: "ВНЖ для бизнеса с рабочими местами для граждан Болгарии"
regime: third_country
subject: applicant
status: draft
version: 1
research_note: >-
  Исследование 2026-10-09 (docs/research/KB_RESEARCH.md, раздел 2.8). Основание — чл. 24 ал. 1 т. 2 ЗЧРБ; ППЗЧРБ чл. 16.
  Текст читался в консолидации Ciela; ДВ не открывался.
applies_if:
  op: and
  all:
    - {op: in, fact: self.citizenship_group, values: [third]}
    - {op: not, cond: {op: in, fact: self.citizenship_group, values: [bg, eu]}}
unsupported:
  - cond:
      op: and
      all:
        - {op: eq, fact: case.who_moves, value: already_in_bg}
        - {op: in, fact: self.status_in_bg, values: [visa_d, long_term, permanent, protection]}
    reason: "Продление или смена уже имеющегося статуса бот пока не проверяет — нужен индивидуальный разбор."
summary: >-
  Основание для тех, кто ведёт в Болгарии коммерческую деятельность и создал рабочие места для граждан Болгарии.
  Сама регистрация фирмы права на ВНЖ не даёт: закон требует занятости граждан Болгарии на полный рабочий день.
requirements:
  - id: business
    label: "Планируется коммерческая деятельность в Болгарии (фирма, ведущая бизнес в законном порядке)"
    cond: {op: in, fact: self.income_sources, values: [business_bg]}
    kind: legal
    stage: any
    on_fail: not_eligible
    fail_text: "Основание доступно только тем, кто ведёт или открывает коммерческую деятельность в Болгарии."
    source_ids: [zchrb]
    verified: false
    research_status: consolidated
    research_note: "чл. 24 ал. 1 т. 2 ЗЧРБ: «осъществяват търговска дейност в страната по законоустановения ред»."
  - id: jobs
    label: "Создано и поддерживается не меньше {param:business_jobs_count} рабочих мест на полный день для граждан Болгарии"
    cond: {op: known_true, fact: self.jobs_10_ready}
    kind: legal
    stage: permit
    on_fail: not_eligible
    fail_text: "Без нужного числа рабочих мест для граждан Болгарии основание недоступно."
    unknown_text: "Уточните, готовы ли вы создать нужное число рабочих мест."
    source_ids: [zchrb, ppzchrb]
    verified: false
    research_status: consolidated
    research_note: "чл. 24 ал. 1 т. 2 ЗЧРБ: «най-малко 10 работни места на пълно работно време за български граждани, поддържани за срока на пребиваването»; чл. 16 ППЗЧРБ: «справка за наетите по трудово правоотношение най-малко 10 български граждани на пълно работно време»."
restrictions:
  - text: "Требование о рабочих местах применяется к каждому партнёру и к каждому управителю отдельно."
    kind: legal
  - text: "Рабочие места нужно поддерживать весь срок пребывания; при продлении проверяют, что рабочие места сохранены."
    kind: legal
  - text: "Международный договор может устанавливать иное правило."
    kind: legal
  - text: "Сначала нужна виза D (консульство Болгарии), затем ВНЖ подаётся в Болгарии по тому же основанию."
    kind: legal
practice_notes:
  - text: "Регистрация фирмы сама по себе ВНЖ не даёт, нужны рабочие места для граждан Болгарии."
    scope: "по данным BGINFO; совпадает с законом"
    kind: practice
documents:
  - "Загранпаспорт"
  - "Документы о регистрации фирмы"
  - "Справка о наёмных работниках — гражданах Болгарии (запрашивается органом по служебной линии)"
  - "Документ о жилье (аренда или собственность)"
  - "Медицинская страховка"
  - "Справка о несудимости (при первичной подаче)"
steps:
  - "Зарегистрировать фирму в Болгарии."
  - "Нанять нужное число граждан Болгарии на полный рабочий день."
  - "Подать на визу D в консульстве Болгарии."
  - "После въезда подать заявление на ВНЖ в дирекцию «Миграция»; продление идёт с проверкой сохранения рабочих мест."
family_note: "Члены семьи не получают ВНЖ автоматически — для них отдельная процедура как для членов семьи иностранца с видом на жительство."
goals: [work, long_term]
bginfo_source_ids: [bg_company]
