# Статус draft, все требования verified=false: одобрение и публикацию выполняет владелец в админке.
id: eu_blue_card
title: "Синяя карта ЕС"
regime: third_country
subject: applicant
status: draft
version: 1
research_note: >-
  Исследование 2026-10-09 (docs/research/KB_RESEARCH.md, раздел 2.5). Основание — чл. 33к ЗЧРБ и чл. 17 ЗТМТМ.
  Тексты читались в консолидации Ciela; ДВ не открывался. Сумма порога зарплаты в евро не найдена: в законе есть только коэффициент.
applies_if:
  op: and
  all:
    - {op: in, fact: self.citizenship_group, values: [third]}
    - {op: not, cond: {op: in, fact: self.citizenship_group, values: [bg, eu]}}
unsupported:
  - cond:
      op: and
      all:
        - {op: eq, fact: case.who_moves, value: already_in_bg}
        - {op: in, fact: self.status_in_bg, values: [visa_d, long_term, permanent, protection]}
    reason: "Продление или смена уже имеющегося статуса бот пока не проверяет — нужен индивидуальный разбор."
summary: >-
  Разрешение на пребывание и работу для квалифицированных специалистов: нужно высшее образование или длительный
  профессиональный опыт, договор не короче 6 месяцев и зарплата не ниже 1,5 средней зарплаты по Болгарии.
requirements:
  - id: offer
    label: "Есть предложение работы от работодателя в Болгарии"
    cond: {op: in, fact: self.income_sources, values: [job_offer_bg]}
    kind: legal
    stage: any
    on_fail: not_eligible
    fail_text: "Основание доступно только при наличии трудового договора с работодателем в Болгарии."
    source_ids: [zchrb, ztmtm]
    verified: false
    research_status: consolidated
    research_note: "чл. 33к ал. 3 ЗЧРБ: заявление подаёт работодатель или иностранец; чл. 17 ЗТМТМ."
  - id: education
    label: "Высшее образование (не меньше 3 лет обучения) либо подтверждённый опыт: 3 года в IT за последние 7 лет или 5 лет на должности уровня высшего образования"
    cond: {op: in, fact: self.higher_education, values: [higher_3y, ict_3y, exp_5y]}
    kind: legal
    stage: permit
    on_fail: not_eligible
    fail_text: "Без высшего образования или нужного профессионального опыта Синяя карта недоступна."
    unknown_text: "Уточните образование и опыт."
    source_ids: [ztmtm]
    verified: false
    research_status: consolidated
    research_note: "чл. 17 ал. 2 т. 1 а), б), в) ЗТМТМ (изм. ДВ бр. 52/2025): «не по-малка от три академични години»; для ИКТ-специалистов опыт 3 года за 7 лет до подачи, для прочих должностей 5 лет."
  - id: salary
    label: "Зарплата по договору не ниже 1,5 средней брутто-зарплаты по Болгарии"
    cond: {op: known_true, fact: self.salary_blue_card}
    kind: legal
    stage: permit
    on_fail: individual_review
    fail_text: "Если зарплата ниже порога, вопрос оценивается индивидуально."
    unknown_text: "Уточните у работодателя размер зарплаты по предложению."
    source_ids: [ztmtm]
    verified: false
    research_status: consolidated
    research_note: "чл. 17 ал. 2 т. 2 ЗТМТМ: «най-малко 1,5 пъти по-висока от средната работна заплата» по данным НСИ за 12 месяцев до подписания договора. Коэффициент в законе есть, сумма в евро на 2026 год не найдена."
  - id: contract
    label: "Трудовой договор на срок не короче 6 месяцев"
    cond: {op: known_true, fact: self.contract_6m}
    kind: legal
    stage: permit
    on_fail: not_eligible
    fail_text: "Для Синей карты договор должен быть не короче 6 месяцев."
    unknown_text: "Уточните срок трудового договора."
    source_ids: [ztmtm]
    verified: false
    research_status: consolidated
    research_note: "чл. 17 ал. 2 т. 3 ЗТМТМ: «не по-кратък от 6 месеца»."
restrictions:
  - text: "Нужно положительное мнение исполнительного директора Агенции по заетостта; квота 20% и 35% для работодателя по этому основанию не применяется."
    kind: legal
  - text: "Карта выдаётся на срок до 5 лет, но не короче 24 месяцев; если договор короче 24 месяцев, срок равен сроку договора плюс 3 месяца."
    kind: legal
  - text: "В первые 12 месяцев работать можно только в Болгарии и по прежнему договору; смена работодателя идёт по особой процедуре, после 12 месяцев — по облегчённой."
    kind: legal
  - text: "Если уже есть ВНЖ, заявление нужно подать не позднее чем за 2 месяца до окончания разрешённого срока."
    kind: legal
practice_notes:
  - text: "К пакету документов обычно добавляют жильё, медицинскую страховку и диплом с легализацией."
    scope: "по данным BGINFO; пересекается с ППЗЧРБ частично"
    kind: practice
  - text: "Держатели Синей карты другой страны ЕС могут иметь упрощения по закону (мобильность); подробно не разбиралось."
    scope: "не проверено"
    kind: practice
documents:
  - "Загранпаспорт"
  - "Трудовой договор не короче 6 месяцев с указанием зарплаты"
  - "Диплом или документы об опыте (с переводом и легализацией)"
  - "Документ о жилье (аренда или собственность)"
  - "Медицинская страховка"
  - "Справка о несудимости (при первичной подаче)"
steps:
  - "Получить предложение работы и подписать договор не короче 6 месяцев."
  - "Подать заявление в «Миграцию» (подаёт работодатель или сам иностранец)."
  - "Получить мнение Агенции по заетостта и визу D, если заявитель за пределами Болгарии."
  - "После въезда получить карту."
family_note: "Члены семьи владельца Синей карты имеют право работать на срок его пребывания (с разрешения Агенции по заетостта); сами они ВНЖ получают по правилам для членов семьи."
goals: [work, live, long_term]
bginfo_source_ids: [bg_blue_card]
