# Статус draft, все требования verified=false: одобрение и публикацию выполняет владелец в админке.
id: investment_real_estate
title: "ВНЖ через инвестицию в недвижимость"
regime: third_country
subject: applicant
status: draft
version: 1
research_note: >-
  Исследование 2026-10-09 (docs/research/KB_RESEARCH.md, раздел 2.9). Основание — чл. 24 ал. 1 т. 19 ЗЧРБ; ППЗЧРБ чл. 29а.
  Отдельная статья BGINFO об инвестиционном ВНЖ не найдена при проверке: ссылка на общий обзор оснований.
  Сумма в евро не подтверждена: закон оставляет 600 000 лв. (по курсу 306 775,13 евро), а в ППЗЧРБ чл. 29а (ДВ бр. 7/2026) записано 306 755,13 евро.
  Нужна сверка с ДВ бр. 7/2026 до показа суммы пользователю.
applies_if:
  op: and
  all:
    - {op: in, fact: self.citizenship_group, values: [third]}
    - {op: not, cond: {op: in, fact: self.citizenship_group, values: [bg, eu]}}
unsupported:
  - cond:
      op: and
      all:
        - {op: eq, fact: case.who_moves, value: already_in_bg}
        - {op: in, fact: self.status_in_bg, values: [visa_d, long_term, permanent, protection]}
    reason: "Продление или смена уже имеющегося статуса бот пока не проверяет — нужен индивидуальный разбор."
summary: >-
  Основание для тех, кто вкладывает в покупку недвижимости в Болгарии сумму не меньше порога, установленного законом,
  на каждого иностранца. Сумма должна быть полностью выплачена, а кредит допускается лишь в ограниченной доле.
requirements:
  - id: plan
    label: "Планируется крупная инвестиция в Болгарии"
    cond: {op: in, fact: self.ties, values: [investment]}
    kind: legal
    stage: any
    on_fail: not_eligible
    fail_text: "Основание доступно только тем, кто вкладывает в недвижимость или компанию в Болгарии."
    source_ids: [zchrb]
    verified: false
    research_status: consolidated
    research_note: "чл. 24 ал. 1 т. 19 ЗЧРБ: «са вложили сума не по-малка от 600 000 лв. - за всеки чужденец»."
  - id: kind
    label: "Инвестиция — покупка недвижимости"
    cond: {op: eq, fact: self.invest_kind, value: real_estate}
    kind: legal
    stage: any
    on_fail: not_eligible
    fail_text: "Для этого основания нужна именно покупка недвижимости. Вложение в компанию проверяется по другому основанию."
    unknown_text: "Уточните вид инвестиции."
    source_ids: [zchrb]
    verified: false
    research_status: consolidated
    research_note: "чл. 24 ал. 1 т. 19 ЗЧРБ: вложение в приобретение недвижимости либо более 50% капитала болгарской компании, которая купила недвижимость."
  - id: amount
    label: "Сумма инвестиции не меньше {param:invest_real_estate}"
    cond: {op: cmp, fact: self.invest_amount_eur, cmp: ">=", param: invest_real_estate}
    kind: legal
    stage: permit
    on_fail: not_eligible
    fail_text: "Сумма ниже порога, установленного законом."
    unknown_text: "Уточните сумму инвестиции."
    source_ids: [zchrb, ppzchrb]
    verified: false
    research_status: unconfirmed
    research_note: >-
      Закон: 600 000 лв. (306 775,13 евро по курсу 1,95583), чл. 24 ал. 1 т. 19. ППЗЧРБ чл. 29а ал. 1 т. 2 (ДВ бр. 7/2026): «сума, не по-малка от 306 755, 13 евро» —
      расхождение в 20 евро, вероятно опечатка в акте. Какая сумма применяется на практике, не подтверждено.
  - id: loan
    label: "Покупка без кредита (непогашенная часть кредита не больше 25%)"
    cond: {op: known_true, fact: self.invest_loan_ok}
    kind: legal
    stage: permit
    on_fail: not_eligible
    fail_text: "Непогашенная часть кредита не может превышать четверть суммы."
    unknown_text: "Уточните, будет ли покупка с кредитом."
    source_ids: [zchrb]
    verified: false
    research_status: consolidated
    research_note: "чл. 24 ал. 1 т. 19 ЗЧРБ: «непогасената част от заема не трябва да надвишава 25 на сто»."
restrictions:
  - text: "На дату подачи заявления вся сумма должна быть выплачена и поступить на счёт лицензированного кредитного учреждения."
    kind: legal
  - text: "Порог относится к каждому иностранцу отдельно."
    kind: legal
  - text: "Нужны справка банка о поступлении суммы и документ о праве собственности (ППЗЧРБ чл. 29а)."
    kind: procedure
  - text: "Сначала нужна виза D (консульство Болгарии), затем ВНЖ подаётся в Болгарии по тому же основанию."
    kind: legal
practice_notes:
  - text: "Простая покупка недвижимости ниже порога основанием для ВНЖ не является."
    scope: "по данным BGINFO"
    kind: practice
  - text: "Сумма порога в евро в законе и в правилнике расходится на несколько евро; перед сделкой её нужно уточнить в «Миграции»."
    scope: "расхождение найдено при проверке; не подтверждено"
    kind: practice
documents:
  - "Загранпаспорт"
  - "Справка банка о поступлении суммы на счёт кредитного учреждения"
  - "Документ о праве собственности на недвижимость"
  - "Медицинская страховка"
  - "Справка о несудимости (при первичной подаче)"
steps:
  - "Перевести сумму инвестиции на счёт в болгарском банке."
  - "Купить недвижимость и оформить право собственности."
  - "Подать на визу D в консульстве Болгарии."
  - "После въезда подать заявление на ВНЖ в дирекцию «Миграция»."
family_note: "Члены семьи не получают ВНЖ автоматически — для них отдельная процедура как для членов семьи иностранца с видом на жительство."
goals: [live, long_term]
bginfo_source_ids: [bg_overview]
