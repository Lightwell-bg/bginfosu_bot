# Мини-апп Telegram (форма) за nginx хоста.
# Установка: скопировать в /etc/nginx/sites-available/form.bginfo.eu, включить симлинком в sites-enabled,
# затем `sudo certbot --nginx -d form.bginfo.eu --redirect` сам добавит блок 443 и сертификат.
server {
    listen 80;
    listen [::]:80;
    server_name form.bginfo.eu;

    client_max_body_size 16k;

    location / {
        proxy_pass http://127.0.0.1:8092;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
