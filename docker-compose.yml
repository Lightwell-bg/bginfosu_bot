x-common: &common
  build: .
  image: bginfo-bot:latest
  restart: unless-stopped
  env_file: .env
  environment:
    DB_PATH: /data/app.db
    CONFIG_INI: /app/config.ini
  volumes:
    - bginfo_data:/data
    - ./config.ini:/app/config.ini:ro
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  bot:
    <<: *common
    command: ["python", "-m", "bginfo.bot"]

  admin:
    <<: *common
    command: ["python", "-m", "bginfo.admin"]
    # сеть хоста: админка слушает host:port из config.ini прямо на сервере
    network_mode: host
    volumes:
      - bginfo_data:/data
      # без :ro — админка правит host/port через страницу «Доступ к админке»
      - ./config.ini:/app/config.ini
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys,pathlib; p=pathlib.Path('/tmp/bginfo_admin_port').read_text().strip(); sys.exit(0 if urllib.request.urlopen(f'http://127.0.0.1:{p}/healthz', timeout=3).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  webapp:
    <<: *common
    command: ["python", "-m", "bginfo.webapp"]
    # слушает 127.0.0.1:8092 ([webapp] в config.ini), наружу только через обратный прокси (nginx хоста или caddy)
    network_mode: host
    healthcheck:
      # порт 8092 совпадает с [webapp] port в config.ini; при смене порта поправьте и здесь, и в deploy/Caddyfile
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8092/healthz', timeout=3).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  caddy:
    image: caddy:2.8
    restart: unless-stopped
    # Только если на сервере нет своего веб-сервера на 80/443; на боевом сервере используется nginx хоста (deploy/nginx/)
    profiles: ["caddy"]
    # нужны свободные порты 80/443 на сервере (Let's Encrypt)
    network_mode: host
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  backup:
    <<: *common
    restart: "no"
    profiles: ["ops"]
    command: ["python", "-m", "bginfo.ops.backup", "backup", "--dir", "/data/backups"]

volumes:
  bginfo_data:
  caddy_data:
  caddy_config:
